<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイカツスターズ！所持チェック</title>
<style>
:root{--blue:#478fd4;--ink:#24435d}
*{box-sizing:border-box}
body{margin:0;background:#f4f9ff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{background:linear-gradient(135deg,#75d0f3,#8e9df5);color:white;text-align:center;padding:18px 12px}
h1{font-size:21px;margin:0 0 4px}
main{max-width:1100px;margin:auto;padding:10px}
.tools{background:#fff;padding:10px;border-radius:14px;box-shadow:0 2px 10px #b9d5ec55;position:sticky;top:0;z-index:2}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;border:1px solid #c7ddef;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}
button.active{background:var(--blue);color:white;border-color:var(--blue)}
#progress{font-size:12px;margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.card{padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:white;position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.card.owned{border-color:#4b9de0}
.card.owned:after{content:"✓";position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:50%;background:#318ad4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
#grid.cols6{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
#grid.cols6 .card{border-radius:5px}
@media(max-width:480px){main{padding:7px}.tools{padding:8px}select,button{padding:8px;font-size:14px}#grid{gap:5px}}
</style>
</head>
<body>
<header>
<h1>アイカツスターズ！所持チェック</h1>
<div>カードをタップして所持・未所持を切り替え</div>
</header>
<main>
<section class="tools">
<div class="line">
<select id="series" aria-label="弾を選択">
<option value="all">すべての弾</option>
<option value="1">1弾</option>
<option value="2">2弾</option>
<option value="3">3弾</option>
</select>
<select id="status" aria-label="所持状況">
<option value="all">すべて表示</option>
<option value="owned">所持済みだけ</option>
<option value="unowned">未所持だけ</option>
</select>
<button id="c3" class="active" type="button">3列</button>
<button id="c6" type="button">6列</button>
<button id="reset" type="button">所持状態をリセット</button>
</div>
<div id="progress">読み込み中…</div>
</section>
<div id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const grid=document.getElementById("grid");
const seriesSelect=document.getElementById("series");
const statusSelect=document.getElementById("status");
const progress=document.getElementById("progress");
const ownedKey="aikatsuStarsOwned";
let cards=[];
let owned={};
let imageFiles={};
let renderVersion=0;

// 非表示にするカード番号
const excludedIds = new Set([
  ...Array.from({length:36},(_,i)=>`2-${299+i}`),
  ...Array.from({length:40},(_,i)=>`3-${293+i}`)
]);

try {
  owned=JSON.parse(localStorage.getItem(ownedKey)||"{}");
} catch(e) {
  owned={};
}

document.getElementById("c3").onclick=()=>{
  grid.classList.remove("cols6");
  document.getElementById("c3").classList.add("active");
  document.getElementById("c6").classList.remove("active");
};
document.getElementById("c6").onclick=()=>{
  grid.classList.add("cols6");
  document.getElementById("c6").classList.add("active");
  document.getElementById("c3").classList.remove("active");
};

document.getElementById("reset").onclick=()=>{
  if(!confirm("所持状態をすべてリセットしますか？"))return;
  owned={};
  localStorage.setItem(ownedKey,JSON.stringify(owned));
  render();
};

seriesSelect.onchange=render;
statusSelect.onchange=render;

async function loadZip(url,setNo){
  const response=await fetch(url);
  if(!response.ok)throw new Error(url+" が見つかりません");
  const zip=await JSZip.loadAsync(await response.arrayBuffer());
  Object.values(zip.files).forEach(file=>{
    if(file.dir)return;
    const name=file.name.split("/").pop();
    imageFiles[setNo+"/"+name]=file;
  });
}

async function start(){
  try{
    progress.textContent="カード情報を読み込み中…";
    const response=await fetch("cards.json");
    if(!response.ok)throw new Error("cards.json が見つかりません");
    cards=await response.json();

    progress.textContent="1弾の画像を読み込み中…";
    await loadZip("images1.zip","1");
    progress.textContent="2弾の画像を読み込み中…";
    await loadZip("images2.zip","2");
    progress.textContent="3弾の画像を読み込み中…";
    await loadZip("images3.zip","3");

    render();
  }catch(error){
    progress.textContent="読み込みエラー："+error.message;
    console.error(error);
  }
}

function getSet(card){
  return String(card.set??card.series??"1");
}

function render(){
  const version=++renderVersion;
  grid.innerHTML="";
  const selectedSeries=seriesSelect.value;
  const selectedStatus=statusSelect.value;

  const filtered=cards.filter(card=>{
    // 指定された76枚を表示しない
    if(excludedIds.has(String(card.id))) return false;

    const seriesMatch=selectedSeries==="all"||getSet(card)===selectedSeries;
    const isOwned=!!owned[card.id];
    const statusMatch=selectedStatus==="all"||
      (selectedStatus==="owned"&&isOwned)||
      (selectedStatus==="unowned"&&!isOwned);
    return seriesMatch&&statusMatch;
  });

  progress.textContent=`${filtered.length}枚を表示中`;
  const fragment=document.createDocumentFragment();

  filtered.forEach(card=>{
    const setNo=getSet(card);
    const imageName=(card.image||"").split("/").pop();
    const file=imageFiles[setNo+"/"+imageName];

    const button=document.createElement("button");
    button.type="button";
    button.className="card"+(owned[card.id]?" owned":"");
    button.setAttribute("aria-label",owned[card.id]?"所持済み":"未所持");

    const img=document.createElement("img");
    img.alt="";
    img.loading="lazy";

    if(file){
      file.async("blob").then(blob=>{
        if(version!==renderVersion)return;
        const objectUrl=URL.createObjectURL(blob);
        img.src=objectUrl;
      }).catch(()=>{});
    }

    button.appendChild(img);
    button.onclick=()=>{
      if(owned[card.id])delete owned[card.id];
      else owned[card.id]=true;
      localStorage.setItem(ownedKey,JSON.stringify(owned));
      render();
    };
    fragment.appendChild(button);
  });

  grid.appendChild(fragment);
  updateProgress();
}

function updateProgress(){
  const selectedSeries=seriesSelect.value;
  const base=cards.filter(card=>
    !excludedIds.has(String(card.id)) &&
    (selectedSeries==="all"||getSet(card)===selectedSeries)
  );
  const count=base.filter(card=>owned[card.id]).length;
  progress.textContent=`表示 ${Array.from(grid.children).length}枚 ／ 所持 ${count} / ${base.length}枚`;
}

start();
</script>
</body>
</html>
