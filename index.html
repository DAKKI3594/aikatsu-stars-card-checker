<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイカツスターズ！1弾 シーズンスプリング</title><style>
:root{--blue:#5b9ee8;--pale:#edf6ff;--pink:#f9e9f4}*{box-sizing:border-box}body{margin:0;background:#f6f9ff;color:#26354b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}header{background:linear-gradient(120deg,#6eb5ff,#c5e6ff);padding:18px 14px;color:#15365d;text-align:center}h1{font-size:21px;margin:0 0 6px}header p{margin:0;font-size:12px}.filters{position:sticky;top:0;z-index:2;background:#fff;padding:10px;box-shadow:0 2px 8px #b7cbe455;display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters input,.filters select{width:100%;min-width:0;padding:9px;border:1px solid #c7d9ec;border-radius:10px;background:white;color:#26354b}.stats{padding:10px 12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 9px 20px}.card{background:#fff;border:1px solid #d9e7f7;border-radius:12px;padding:7px;overflow:hidden;box-shadow:0 2px 5px #adc6df22}.card img{width:100%;height:180px;object-fit:contain;background:#f9fbff;border-radius:7px}.card .small{font-size:11px;color:#75849a;margin:5px 0}.card select{width:100%;margin:3px 0;padding:7px 4px;border:1px solid #d3e1ef;border-radius:7px;background:white;font-size:12px}.own{display:flex;align-items:center;gap:6px;background:#eaf4ff;padding:8px;border-radius:8px;font-size:13px;margin-top:4px}.own input{width:18px;height:18px;accent-color:#3987df}.actions{display:flex;gap:8px;padding:0 10px 12px}.actions button{flex:1;padding:10px;border:0;border-radius:10px;background:#4f94df;color:white;font-weight:600}.actions button.secondary{background:#e7eef8;color:#28486a}.note{font-size:12px;color:#65758a;padding:0 12px 16px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:230px}.filters{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>アイカツスターズ！</h1><p>1弾 シーズンスプリング｜カード所持チェック</p></header><div class="filters"><input id="q" placeholder="画像番号で検索"><select id="type"><option value="">すべてのタイプ</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select><select id="rarity"><option value="">すべてのレアリティ</option><option>ノーマル</option><option>レア</option><option>プレミアム</option><option>キャンペーン</option></select><select id="category"><option value="">すべてのカテゴリ</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>アクセ</option></select><select id="owned"><option value="">所持状態：すべて</option><option value="no">未所持</option><option value="yes">所持済</option></select></div><div class="stats" id="stats"></div><div class="actions"><button id="export">データを書き出す</button><button id="import" class="secondary">データを読み込む</button><input id="file" type="file" accept="application/json" hidden></div><main class="grid" id="grid"></main><p class="note">タイプ・レアリティ・カテゴリは各カードのプルダウンから設定できます。設定と所持状況はこのブラウザに保存されます。別の端末に移すときは「データを書き出す」を使ってね。</p><script>
let cards=[];const types=['キュート','クール','セクシー','ポップ'],rarities=['ノーマル','レア','プレミアム','キャンペーン'],categories=['トップス','ボトムス','シューズ','アクセ'];const $=id=>document.getElementById(id);const opts=(arr,sel)=>'<option value="">未設定</option>'+arr.map(v=>`<option ${sel===v?'selected':''}>${v}</option>`).join('');function save(){localStorage.setItem('stars1data',JSON.stringify(cards));render()}function loadSaved(){try{const s=JSON.parse(localStorage.getItem('stars1data')||'null');if(s&&s.length===cards.length)cards=s}catch(e){}}function render(){let q=$('q').value.toLowerCase(),t=$('type').value,r=$('rarity').value,c=$('category').value,o=$('owned').value;let list=cards.filter(x=>(!q||x.image.toLowerCase().includes(q))&&(!t||x.type===t)&&(!r||x.rarity===r)&&(!c||x.category===c)&&(!o||(o==='yes'&&x.owned)||(o==='no'&&!x.owned)));$('stats').textContent=`表示 ${list.length}枚 ／ 登録画像 ${cards.length}枚 ／ 所持済 ${cards.filter(x=>x.owned).length}枚`;$('grid').innerHTML=list.map(x=>`<article class="card"><img loading="lazy" src="${x.image}" alt="カード画像 ${x.id}"><div class="small">画像 ${x.id} · ${x.image.split('/').pop()}</div><select aria-label="タイプ" data-id="${x.id}" data-field="type">${opts(types,x.type)}</select><select aria-label="レアリティ" data-id="${x.id}" data-field="rarity">${opts(rarities,x.rarity)}</select><select aria-label="カテゴリ" data-id="${x.id}" data-field="category">${opts(categories,x.category)}</select><label class="own"><input type="checkbox" data-id="${x.id}" data-field="owned" ${x.owned?'checked':''}> 所持済</label></article>`).join('')||'<p>該当するカードがないよ。</p>'}fetch('cards.json').then(r=>r.json()).then(data=>{cards=data;loadSaved();render()});['q','type','rarity','category','owned'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$('grid').addEventListener('change',e=>{let id=Number(e.target.dataset.id),f=e.target.dataset.field;if(!f)return;let x=cards.find(v=>v.id===id);x[f]=f==='owned'?e.target.checked:e.target.value;save()});$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='stars1-data.json';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(Array.isArray(data)&&data.length===cards.length){cards=data;save();alert('読み込みました！')}else alert('このサイトのデータではないみたい。')}catch(err){alert('ファイルを読み込めませんでした。')}};
</script></body></html>
