
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイカツスターズ！所持チェック</title>
<style>
:root{--blue:#478fd4;--ink:#24435d}
*{box-sizing:border-box}
body{margin:0;background:#f4f9ff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{background:linear-gradient(135deg,#75d0f3,#8e9df5);color:white;text-align:center;padding:18px 12px}
h1{font-size:21px;margin:0 0 4px}
main{max-width:1100px;margin:auto;padding:10px}
.tools{background:#fff;padding:10px;border-radius:14px;box-shadow:0 2px 10px #b9d5ec55;position:sticky;top:0;z-index:2}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;border:1px solid #c7ddef;border-radius:10px;padding:9px;background:#fff;color:var(--ink)}
button.active{background:var(--blue);color:white;border-color:var(--blue)}
#progress{font-size:12px;margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.card{padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:white;position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain;display:block}
.card.owned{border-color:#4b9de0}
.card.owned:after{content:"✓";position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:50%;background:#318ad4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 1px 5px #3335}
#grid.cols6{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
#grid.cols6 .card{border-radius:5px}
@media(max-width:480px){main{padding:7px}.tools{padding:8px}select,button{padding:8px;font-size:14px}#grid{gap:5px}}
</style>
</head>
<body>
<header>
<h1>アイカツスターズ！所持チェック</h1>
<div>カードをタップして所持・未所持を切り替え</div>
</header>
<main>
<section class="tools">
<div class="line">
<select id="series" aria-label="弾を選択">
<option value="all">すべて</option>
<option value="1">1弾</option>
<option value="2">2弾</option>
<option value="3">3弾</option>
</select>
<button id="c3" class="active" type="button">3列</button>
<button id="c6" type="button">6列</button>
<button id="reset" type="button">所持状態をリセット</button>
</div>
<div id="progress">読み込み中…</div>
</section>
<div id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const grid=document.getElementById('grid');
const series=document.getElementById('series');
const progress=document.getElementById('progress');

let cards=[];
let owned={};

try{
  owned=JSON.parse(localStorage.getItem('starsOwnedV2')||'{}')||{};
}catch(e){owned={};}

function save(){
  try{
    localStorage.setItem('starsOwnedV2',JSON.stringify(owned));
  }catch(e){}
}

function render(){
  const s=series.value;
  const list=cards.filter(c=>s==='all'||String(c.set)===s);
  grid.innerHTML='';

  for(const c of list){
    const b=document.createElement('button');
    b.type='button';
    b.className='card'+(owned[c.id]?' owned':'');
    b.setAttribute('aria-label',owned[c.id]?'所持済み':'未所持');

    const im=document.createElement('img');
    im.loading='lazy';
    im.alt='';
    im.src=c.image;
    b.appendChild(im);

    b.addEventListener('click',()=>{
      owned[c.id]=!owned[c.id];
      save();
      b.classList.toggle('owned',!!owned[c.id]);
      b.setAttribute('aria-label',owned[c.id]?'所持済み':'未所持');
      updateProgress();
    });

    grid.appendChild(b);
  }
  updateProgress();
}

function updateProgress(){
  const s=series.value;
  const list=cards.filter(c=>s==='all'||String(c.set)===s);
  const n=list.filter(c=>owned[c.id]).length;
  progress.textContent=
    `${s==='all'?'すべて':s+'弾'}：${n} / ${list.length} 枚 所持`;
}

series.addEventListener('change',render);

document.getElementById('c3').addEventListener('click',()=>{
  grid.classList.remove('cols6');
  document.getElementById('c3').classList.add('active');
  document.getElementById('c6').classList.remove('active');
});

document.getElementById('c6').addEventListener('click',()=>{
  grid.classList.add('cols6');
  document.getElementById('c6').classList.add('active');
  document.getElementById('c3').classList.remove('active');
});

document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('保存した所持状態をすべてリセットしますか？')){
    owned={};
    save();
    render();
  }
});

async function loadCards(){
  try{
    progress.textContent='画像を読み込み中…';

    const [data,response]=await Promise.all([
      fetch('cards.json').then(r=>{
        if(!r.ok) throw Error('cards.json');
        return r.json();
      }),
      fetch('images.zip')
    ]);

    if(!response.ok) throw Error('images.zip');

    const zip=await JSZip.loadAsync(await response.arrayBuffer());
    cards=[];

    for(const c of data){
      const filename=String(c.image).split('/').pop();
      const file=zip.file(filename);
      if(!file) continue;

      const blob=await file.async('blob');
      const imageUrl=URL.createObjectURL(blob);

      cards.push({
        ...c,
        set:String(c.set ?? c.series ?? ''),
        image:imageUrl
      });
    }

    if(cards.length===0) throw Error('画像が見つかりません');
    render();

  }catch(e){
    console.error(e);
    progress.textContent=
      '読み込み失敗：cards.json・images.zipの名前と中身を確認してね。';
  }
}

loadCards();
</script>
</body>
</html>
